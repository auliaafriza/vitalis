project_id = "calorya"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true

# ---------------------------------------------------------------------------
# PERINGATAN: berkas ini mengatur Supabase LOKAL (`supabase start`).
#
# Site URL proyek yang di-hosting TIDAK diatur dari sini — tempatnya di
# dashboard: Authentication → URL Configuration. Kalau `site_url` di bawah
# ikut terkirim ke proyek produksi (misalnya lewat `supabase config push`),
# tautan konfirmasi email untuk SEMUA pengguna akan menunjuk ke localhost.
# Itu persis bug yang berulang di proyek ini. Jangan push berkas ini ke
# proyek produksi tanpa mengganti site_url lebih dulu.
# ---------------------------------------------------------------------------
site_url = "http://localhost:3000"

# Daftar izin tujuan redirect. Supabase hanya menghormati `emailRedirectTo`
# kalau URL-nya cocok dengan salah satu pola di sini; kalau tidak cocok, dia
# diam-diam kembali memakai site_url — tanpa error, tanpa peringatan.
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://calorya-web.vercel.app/**",
  "calorya://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so `supabase start` + sign-up works without an inbox.
# Turn this ON in the hosted project.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324

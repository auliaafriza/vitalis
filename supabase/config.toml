project_id = "vitalis"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "vitalis://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so `supabase start` + sign-up works without an inbox.
# Turn this ON in the hosted project.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
